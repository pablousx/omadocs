name: Publish website to GitHub Pages

# Publish intentionally from the Actions tab, after reviewing the site.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check static website
        run: python3 scripts/check-site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # GitHub Pages mounts this project artifact at /omadocs/.
      - name: Upload website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
