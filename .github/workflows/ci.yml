name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # System Python lets the desktop tests import the packaged PyGObject.
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python-is-python3 python3-requests python3-secretstorage python3-gi gir1.2-glib-2.0 desktop-file-utils xdg-utils
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

  website-validation:
    name: Website validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate website
        run: python3 scripts/check-site.py
