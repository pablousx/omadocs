[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omadocs"
version = "0.1.0"
description = "Omarchy Quattro Office-to-Drive upload handler"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["requests>=2.32,<3", "SecretStorage>=3.3,<4"]

[project.scripts]
omadocs = "omadocs.cli:main"

[tool.setuptools]
packages = ["omadocs"]
